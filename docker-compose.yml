services:
  document-control-assistant:
    build: .
    container_name: document-control-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      AUTH_REQUIRED: "true"
      DOCUMENT_DB_PATH: /app/data/document_register.db
    volumes:
      - document_data:/app/data
      - compliance_data:/app/compliance_reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  document_data:
  compliance_data:
